<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256" width="512" height="256" fill="none" role="img" aria-label="Marketplace feature art">
  <defs>
    <linearGradient id="bg" x1="50" y1="20" x2="480" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="256" rx="22" fill="url(#bg)"/>
  <circle cx="78" cy="178" r="34" fill="#7DD3FC" fill-opacity=".22"/>
  <circle cx="430" cy="172" r="40" fill="#BAE6FD" fill-opacity=".16"/>
  <path d="M470 210l10 10l-10 10l-10-10Z" fill="#E8F3EC" fill-opacity=".9"/>

  <!-- Shopping cart -->
  <g filter="url(#soft)" stroke="#0B1220" stroke-opacity=".55" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M144 84h28l16 108c2 14 14 24 28 24h134c14 0 26-10 28-24l18-84H214"/>
    <circle cx="236" cy="216" r="18" fill="#F5F1E6"/>
    <circle cx="356" cy="216" r="18" fill="#F5F1E6"/>
    <!-- basket -->
    <path d="M214 116h202l-14 70c-2 10-10 18-20 18H248c-10 0-18-7-20-17l-14-71Z" fill="#F5F1E6"/>
    <path d="M246 140h138" stroke-opacity=".35"/>
    <path d="M242 162h142" stroke-opacity=".28"/>
  </g>

  <!-- Tokens -->
  <g filter="url(#soft)">
    <circle cx="262" cy="96" r="18" fill="#F5F1E6" stroke="#0B1220" stroke-opacity=".45" stroke-width="6"/>
    <circle cx="298" cy="88" r="18" fill="#F5F1E6" stroke="#0B1220" stroke-opacity=".45" stroke-width="6"/>
    <circle cx="334" cy="96" r="18" fill="#F5F1E6" stroke="#0B1220" stroke-opacity=".45" stroke-width="6"/>
  </g>
</svg>
