<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256" width="512" height="256" fill="none" role="img" aria-label="Inventory feature art">
  <defs>
    <linearGradient id="bg" x1="40" y1="10" x2="470" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="512" height="256" rx="22" fill="url(#bg)"/>
  <circle cx="64" cy="190" r="34" fill="#60A5FA" fill-opacity=".25"/>
  <circle cx="448" cy="170" r="38" fill="#93C5FD" fill-opacity=".18"/>
  <path d="M464 206l10 10l-10 10l-10-10Z" fill="#E8F3EC" fill-opacity=".9"/>

  <!-- Crates pile -->
  <g filter="url(#soft)" stroke="#0B1220" stroke-opacity=".55" stroke-width="6" stroke-linejoin="round">
    <g fill="#F5F1E6">
      <path d="M138 160h98v66H138z"/>
      <path d="M212 122h98v104h-98z"/>
      <path d="M286 156h98v70h-98z"/>
      <path d="M174 112h92v54h-92z"/>
      <path d="M322 114h86v48h-86z"/>
    </g>
    <!-- simple inset lines -->
    <g stroke="#0B1220" stroke-opacity=".45">
      <path d="M156 178h62v30h-62z"/>
      <path d="M230 140h62v68h-62z"/>
      <path d="M304 174h62v34h-62z"/>
      <path d="M192 128h56v22h-56z"/>
      <path d="M338 128h54v20h-54z"/>
    </g>
    <!-- latch details -->
    <g fill="#1D4ED8" fill-opacity=".25" stroke="none">
      <rect x="202" y="152" width="18" height="10" rx="3"/>
      <rect x="276" y="186" width="18" height="10" rx="3"/>
      <rect x="350" y="150" width="18" height="10" rx="3"/>
    </g>
  </g>
</svg>
