      <stop offset="0" stop-color="#F87171"/>
      <stop offset="1" stop-color="#B91C1C"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity=".18"/>
