    <path d="M256 208c16-14 10-34-2-46c-2 14-16 16-18 30c-2 16 8 28 20 28Z" fill="#0B1220" fill-opacity=".20" stroke="none"/>
    <path d="M258 196c10-9 6-22-1-30c-1 9-10 11-12 20c-1 10 6 18 13 18Z" fill="#F5F1E6" fill-opacity=".85" stroke="none"/>
    <circle cx="334" cy="154" r="6" fill="#2F6F43" fill-opacity=".95" stroke="none"/>
