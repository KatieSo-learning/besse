<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256" width="512" height="256" fill="none" role="img" aria-label="Residential Waste Collection feature art">
  <defs>
    <linearGradient id="bg" x1="40" y1="18" x2="476" y2="246" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="256" rx="22" fill="url(#bg)"/>
  <rect x="0" y="168" width="512" height="88" fill="#0B1220" fill-opacity=".12"/>
  <circle cx="78" cy="206" r="32" fill="#0B1220" fill-opacity=".18"/>
  <circle cx="438" cy="206" r="32" fill="#0B1220" fill-opacity=".18"/>
  <path d="M468 210l10 10l-10 10l-10-10Z" fill="#E8F3EC" fill-opacity=".9"/>

  <!-- House + bins (clear at small sizes) -->
  <g filter="url(#soft)" stroke="#0B1220" stroke-opacity=".55" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <path d="M206 120l50-44l50 44" fill="none"/>
    <path d="M214 118h84v112h-84z" fill="#F5F1E6"/>
    <path d="M246 166h20v64h-20z" fill="#0B1220" fill-opacity=".45" stroke="none"/>
    <rect x="232" y="144" width="18" height="18" fill="#0B1220" fill-opacity=".10" stroke="none"/>
    <rect x="270" y="144" width="18" height="18" fill="#0B1220" fill-opacity=".10" stroke="none"/>

    <!-- Two collection bins -->
    <path d="M152 158h38v66h-38z" fill="#F5F1E6"/>
    <path d="M322 158h38v66h-38z" fill="#F5F1E6"/>
    <path d="M148 156h46" stroke="#F5F1E6" stroke-opacity=".85" stroke-width="10"/>
    <path d="M318 156h46" stroke="#F5F1E6" stroke-opacity=".85" stroke-width="10"/>
    <path d="M170 186l6 10h-10v-10z" fill="#0B1220" fill-opacity=".18" stroke="none"/>
    <circle cx="360" cy="150" r="6" fill="#2F6F43" fill-opacity=".95" stroke="none"/>
  </g>
</svg>
