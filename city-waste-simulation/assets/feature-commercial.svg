<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256" width="512" height="256" fill="none" role="img" aria-label="Commercial feature art">
  <defs>
    <linearGradient id="bg" x1="44" y1="18" x2="482" y2="246" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="256" rx="22" fill="url(#bg)"/>
  <circle cx="76" cy="180" r="34" fill="#FDE68A" fill-opacity=".22"/>
  <circle cx="432" cy="176" r="40" fill="#FFEDD5" fill-opacity=".16"/>
  <path d="M468 210l10 10l-10 10l-10-10Z" fill="#E8F3EC" fill-opacity=".9"/>

  <!-- Shop -->
  <g filter="url(#soft)" stroke="#0B1220" stroke-opacity=".55" stroke-width="8" stroke-linejoin="round">
    <!-- awning -->
    <path d="M172 92h168c12 0 22 10 22 22v6H150v-6c0-12 10-22 22-22Z" fill="#0B1220" fill-opacity=".16" stroke="none"/>
    <path d="M160 120h192" stroke="#F5F1E6" stroke-opacity=".85" stroke-width="10" stroke-linecap="round"/>
    <!-- body -->
    <path d="M170 120h172v110H170z" fill="#F5F1E6"/>
    <!-- windows -->
    <rect x="192" y="144" width="54" height="36" fill="#0B1220" fill-opacity=".10" stroke="none"/>
    <rect x="266" y="144" width="54" height="36" fill="#0B1220" fill-opacity=".10" stroke="none"/>
    <!-- door -->
    <path d="M242 166h28v64h-28z" fill="#0B1220" fill-opacity=".40" stroke="none"/>
    <!-- small tag dot -->
    <circle cx="332" cy="138" r="6" fill="#2F6F43" fill-opacity=".95" stroke="none"/>
  </g>
</svg>
