<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256" width="512" height="256" fill="none" role="img" aria-label="Residential feature art">
  <defs>
    <linearGradient id="bg" x1="40" y1="18" x2="476" y2="246" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="256" rx="22" fill="url(#bg)"/>
  <!-- simple skyline blocks -->
  <rect x="94" y="112" width="92" height="96" rx="8" fill="#0B1220" fill-opacity=".18"/>
  <rect x="188" y="86" width="148" height="122" rx="10" fill="#0B1220" fill-opacity=".14"/>
  <rect x="338" y="104" width="116" height="104" rx="10" fill="#0B1220" fill-opacity=".12"/>
  <circle cx="84" cy="202" r="30" fill="#0B1220" fill-opacity=".20"/>
  <circle cx="434" cy="204" r="30" fill="#0B1220" fill-opacity=".20"/>

  <!-- House -->
  <g filter="url(#soft)" stroke="#0B1220" stroke-opacity=".55" stroke-width="8" stroke-linejoin="round">
    <path d="M206 120l50-44l50 44" fill="none"/>
    <path d="M214 118h84v112h-84z" fill="#F5F1E6"/>
    <path d="M246 166h20v64h-20z" fill="#0B1220" fill-opacity=".45" stroke="none"/>
    <rect x="232" y="144" width="18" height="18" fill="#E8F3EC" fill-opacity=".25" stroke="none"/>
    <rect x="270" y="144" width="18" height="18" fill="#E8F3EC" fill-opacity=".25" stroke="none"/>
  </g>
</svg>
